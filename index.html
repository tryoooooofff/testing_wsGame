<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>多人实时球球游戏</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #111;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

let ws;
let players = {};
let objects = [];
let myId = null;

const input = { x: 0, y: 0 };
const keys = {};

window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

function updateInput() {
  input.x = 0;
  input.y = 0;

  if (keys['w'] || keys['ArrowUp']) input.y -= 1;
  if (keys['s'] || keys['ArrowDown']) input.y += 1;
  if (keys['a'] || keys['ArrowLeft']) input.x -= 1;
  if (keys['d'] || keys['ArrowRight']) input.x += 1;

  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({
      type: 'input',
      input
    }));
  }
}

let inputTimer = null;

function startInputLoop() {
  if (inputTimer) clearInterval(inputTimer);
  inputTimer = setInterval(updateInput, 50);
}

function connect() {
  ws = new WebSocket("ws://localhost:8080");

  ws.onopen = () => {
    console.log("connected");
    startInputLoop();
  };

  ws.onmessage = (msg) => {
    const data = JSON.parse(msg.data);

    if (data.type === 'init') {
      myId = data.id;
    }

    if (data.type === 'state') {
      players = data.players;
      objects = data.objects;
    }
  };

  ws.onclose = () => {
    console.log("disconnected, reconnecting...");
    setTimeout(connect, 1000);
  };

  ws.onerror = () => {
    ws.close();
  };
}

connect();

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (const o of objects) {
    ctx.fillStyle = o.type === 'blue' ? 'blue' : 'red';
    ctx.fillRect(o.x - 5, o.y - 5, 10, 10);
  }

  for (const id in players) {
    const p = players[id];

    ctx.beginPath();
    ctx.fillStyle = id == myId ? 'lime' : 'white';
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();

    // HP bar
    ctx.fillStyle = 'red';
    ctx.fillRect(p.x - 20, p.y - 30, 40, 4);

    ctx.fillStyle = 'green';
    ctx.fillRect(p.x - 20, p.y - 30, 40 * (p.hp / p.maxHp), 4);
  }

  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
