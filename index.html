<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>⚔ Tank Battle — WebSocket Multiplayer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0d1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    color: #ccc;
    overflow: hidden;
  }
  h1 {
    font-size: 20px;
    color: #44aaff;
    letter-spacing: 3px;
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  #canvas-wrap {
    position: relative;
    width: min(800px, 100vw);
    aspect-ratio: 800 / 600;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    border: 1px solid rgba(100,200,255,0.2);
  }
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(10, 10, 26, 0.92);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 10;
  }
  #overlay h2 { font-size: 26px; color: #44aaff; letter-spacing: 4px; }
  #overlay p  { font-size: 12px; color: #666; text-align: center; line-height: 1.8; }
  #nameInput {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(100,200,255,0.4);
    color: #fff;
    padding: 10px 18px;
    font-size: 16px;
    font-family: monospace;
    border-radius: 4px;
    outline: none;
    width: 220px;
    text-align: center;
  }
  #nameInput::placeholder { color: #555; }
  #joinBtn {
    background: #44aaff;
    border: none;
    color: #0d0d1a;
    padding: 10px 32px;
    font-size: 15px;
    font-family: monospace;
    font-weight: bold;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 2px;
    transition: background 0.2s;
  }
  #joinBtn:hover { background: #66ccff; }
  #status { font-size: 13px; color: #ff6666; min-height: 20px; }
  .tips {
    font-size: 11px;
    color: #444;
    margin-top: 8px;
    line-height: 2;
  }
</style>
</head>
<body>
<h1>⚔ Tank Battle</h1>
<div id="canvas-wrap">
  <canvas id="game" width="800" height="600"></canvas>
  <div id="overlay">
    <h2>TANK BATTLE</h2>
    <p>多人实时对战 · WebSocket · 低延迟二进制协议</p>
    <input id="nameInput" type="text" placeholder="输入你的名字" maxlength="12" autofocus>
    <button id="joinBtn">开始战斗</button>
    <span id="status"></span>
    <div class="tips">
      WASD / 方向键 移动 &nbsp;|&nbsp; 鼠标瞄准 &nbsp;|&nbsp; 鼠标左键 / 空格 射击<br>
      🔫 弹药补给 &nbsp;|&nbsp; 🛡 护盾 &nbsp;|&nbsp; 击杀得分
    </div>
  </div>
</div>
<script src="js/game.js"></script>
</body>
</html>
