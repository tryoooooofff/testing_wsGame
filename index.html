<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>多人实时球球游戏</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #111;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ====== WebSocket连接 ======
const ws = new WebSocket("ws://localhost:8080");

let players = {};
let objects = [];
let myId = null;

// 输入状态
const input = {
  x: 0,
  y: 0
};

// 键盘控制
const keys = {};
window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

function updateInput() {
  input.x = 0;
  input.y = 0;

  if (keys['w'] || keys['ArrowUp']) input.y -= 1;
  if (keys['s'] || keys['ArrowDown']) input.y += 1;
  if (keys['a'] || keys['ArrowLeft']) input.x -= 1;
  if (keys['d'] || keys['ArrowRight']) input.x += 1;

  ws.send(JSON.stringify({
    type: 'input',
    input
  }));
}

// 每帧发送输入（可调低频减少流量）
setInterval(updateInput, 50); // 20Hz

ws.onmessage = (msg) => {
  const data = JSON.parse(msg.data);

  if (data.type === 'init') {
    myId = data.id;
  }

  if (data.type === 'state') {
    players = data.players;
    objects = data.objects;
  }
};

// ====== 渲染 ======
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 画方块/三角
  for (const o of objects) {
    if (o.type === 'blue') ctx.fillStyle = 'blue';
    if (o.type === 'red') ctx.fillStyle = 'red';

    ctx.beginPath();
    ctx.rect(o.x - 5, o.y - 5, 10, 10);
    ctx.fill();
  }

  // 画玩家
  for (const id in players) {
    const p = players[id];

    ctx.beginPath();
    ctx.fillStyle = id == myId ? 'lime' : 'white';
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();

    // 血条
    ctx.fillStyle = 'red';
    ctx.fillRect(p.x - 20, p.y - 30, 40, 4);

    ctx.fillStyle = 'green';
    ctx.fillRect(p.x - 20, p.y - 30, 40 * (p.hp / p.maxHp), 4);
  }

  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
